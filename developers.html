<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Circaevum documentation for users, developers, and agents. Includes account sign-in, Nakama authentication, the viewer, and interactive Garmin API requests.">
    <title>Circaevum Documentation</title>
    <link rel="describedby" href="/llms.txt" type="text/plain">
    <link rel="alternate" type="text/markdown" href="/docs/FOR-AGENTS.md" title="For agents">
    <link rel="api-catalog" href="/.well-known/api-catalog" type="application/linkset+json">
    <link rel="service-doc" href="/.well-known/agent-skills/index.json" type="application/json">
    <link rel="service-doc" href="/.well-known/mcp/server-card.json" type="application/json">
    <link rel="service-desc" href="/docs/garmin-openapi.json" type="application/json">
    <style>
        body { margin: 0; font: 15px system-ui, sans-serif; }
        .docs-account { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--scalar-border-color, #8884); background: var(--scalar-background-1, Canvas); color: var(--scalar-color-1, CanvasText); }
        .docs-account a, .docs-account button { color: inherit; }
        .docs-account button, #account-dialog button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--scalar-border-color, #8888); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
        .docs-account .brand { font-weight: 650; margin-inline-end: auto; text-decoration: none; }
        #account-dialog { width: min(470px, calc(100% - 40px)); max-height: 90dvh; color: CanvasText; background: Canvas; border: 1px solid #8888; border-radius: 12px; padding: 16px; }
        #account-dialog::backdrop { background: #0008; }
        #account-dialog form { display: flex; justify-content: space-between; align-items: center; }
        #account-frame iframe { display: block; width: 100%; height: min(370px, 64dvh); border: 0; }
        .docs-fallback { padding: 16px 20px; }
    </style>
</head>
<body>
    <header class="docs-account">
        <a class="brand" href="/">Circaevum</a>
        <span id="api-reference-status" role="status"></span>
        <button type="button" id="api-connect-button" hidden>Connect to Nakama</button>
        <a id="api-account-link" href="https://app.circaevum.com/?view=account">Account settings</a>
    </header>
    <main id="api-reference">
        <div id="scalar-api-reference"></div>
        <p id="docs-fallback" class="docs-fallback">Loading documentation… <a href="/docs/">Documentation index</a> · <a href="/docs/garmin-openapi.json">OpenAPI document</a></p>
        <noscript><p class="docs-fallback">Enable JavaScript for the interactive reference. Read the <a href="/docs/FOR-AGENTS.md">agent guide</a>, <a href="/API.md">Graphics Library API</a>, or <a href="/.well-known/mcp/server-card.json">MCP Server Card</a> directly.</p></noscript>
    </main>
    <dialog id="account-dialog" aria-labelledby="account-dialog-title">
        <form method="dialog"><strong id="account-dialog-title">Connect to Nakama</strong><button>Close</button></form>
        <div id="account-frame"></div>
        <p><a id="account-full-link" href="https://app.circaevum.com/?view=account" target="_blank" rel="noopener">Open account settings in a new tab</a></p>
    </dialog>
    <script defer src="circaevum/js/vendor/scalar/api-reference-1.79.0.js"></script>
    <script defer src="circaevum/js/ui/developer-api-reference.js?v=agent-discovery"></script>
</body>
</html>
